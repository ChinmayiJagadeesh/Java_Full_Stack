<!DOCTYPE html>
<html>
<head>
<style>
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.card {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

.card:hover {
    background: lightgray;
}
</style>
</head>
<body>

<div class="grid">

<div class="card">Product 1<br>₹100<br><button>Buy</button></div>
<div class="card">Product 2<br>₹200<br><button>Buy</button></div>
<div class="card">Product 3<br>₹300<br><button>Buy</button></div>
<div class="card">Product 4<br>₹400<br><button>Buy</button></div>
<div class="card">Product 5<br>₹500<br><button>Buy</button></div>
<div class="card">Product 6<br>₹600<br><button>Buy</button></div>

</div>

</body>
</html>
